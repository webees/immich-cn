# 中国本地化加速源站示例：Nginx 只缓存 /_app/immutable/*，其余请求旁路。
# 将此文件与 nginx/immich-cn.conf 一起复制到项目目录，并按 Immich 官方要求提供 .env。
name: immich

services:
  immich-server:
    image: ${IMMICH_CN_GHCR_MIRROR:-ghcr.nju.edu.cn}/webees/immich-cn-server:latest
    container_name: immich_server
    env_file:
      - .env
    environment:
      TZ: Asia/Shanghai
      IMMICH_CN_PATTERN: "{admin_2}"
      IMMICH_CN_FORCE_RELOAD: "0"
    volumes:
      - ${UPLOAD_LOCATION}:/data
      - /etc/localtime:/etc/localtime:ro
    expose:
      - "2283"
    depends_on:
      - redis
      - database
    restart: always

  immich-machine-learning:
    image: ${IMMICH_CN_GHCR_MIRROR:-ghcr.nju.edu.cn}/immich-app/immich-machine-learning:release
    container_name: immich_machine_learning
    env_file:
      - .env
    environment:
      TZ: Asia/Shanghai
    volumes:
      - model-cache:/cache
    restart: always
    healthcheck:
      disable: false

  nginx:
    image: docker.io/nginx:1.29-alpine@sha256:5616878291a2eed594aee8db4dade5878cf7edcb475e59193904b198d9b830de
    container_name: immich_cn_nginx
    ports:
      - "${IMMICH_CN_HTTP_PORT:-8080}:80"
    volumes:
      - ./nginx/immich-cn.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - immich-server
    restart: always

  redis:
    image: docker.io/valkey/valkey:9@sha256:c123e3715db63d06d4ad6964884037aa0d5d4d703939b9929954112889708e1d
    container_name: immich_redis
    healthcheck:
      test: redis-cli ping || exit 1
    restart: always

  database:
    image: ${IMMICH_CN_GHCR_MIRROR:-ghcr.nju.edu.cn}/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0
    container_name: immich_postgres
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_DB: ${DB_DATABASE_NAME}
      POSTGRES_INITDB_ARGS: "--data-checksums"
    volumes:
      - ${DB_DATA_LOCATION}:/var/lib/postgresql/data
    shm_size: 128mb
    restart: always

volumes:
  model-cache:
