# Immich 中国本地化加速源站示例。
# 只对 SvelteKit 的不可变构建资源开启共享缓存；HTML、API、照片和视频默认旁路。

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

proxy_cache_path /var/cache/nginx/immich-cn
    levels=1:2
    keys_zone=immich_static:20m
    max_size=2g
    inactive=30d
    use_temp_path=off;

server {
    listen 80;
    server_name _;
    client_max_body_size 50000M;
    client_body_buffer_size 1024k;
    # 大文件上传不在 Nginx 落盘缓冲，避免代理层占用额外磁盘和内存。
    proxy_request_buffering off;
    proxy_redirect off;
    # Immich 的长连接、WebSocket 和大文件传输需要更长的空闲超时。
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
    send_timeout 600s;
    # Docker Compose 内置 DNS；Nginx 在运行时解析服务名，nginx -t 不依赖容器已启动。
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $immich_upstream http://immich-server:2283;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    location ^~ /_app/immutable/ {
        proxy_pass $immich_upstream;
        proxy_cache immich_static;
        proxy_cache_key "$scheme$request_method$host$request_uri";
        proxy_cache_valid 200 365d;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_background_update on;
        proxy_cache_lock on;
        proxy_ignore_headers Set-Cookie;
        proxy_hide_header Set-Cookie;
        # 不加 always：404/500 等错误响应不应被浏览器缓存一年。
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Immich-CN-Cache $upstream_cache_status always;
    }

    # 其余请求不做共享缓存；认证头、Cookie、WebSocket 和 Range 请求原样透传。
    location / {
        proxy_pass $immich_upstream;
    }
}
