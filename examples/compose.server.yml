# 开箱即用：在 official compose.yaml 基础上，只需把 immich-server 的 image 换成
# ghcr.io/webees/immich-cn-server:latest，并追加 IMMICH_CN_* 环境变量。
name: immich

services:
  immich-server:
    image: ghcr.io/webees/immich-cn-server:latest
    container_name: immich_server
    env_file:
      - .env
    environment:
      TZ: Asia/Shanghai
      IMMICH_CN_PATTERN: "{admin_2}"
      IMMICH_CN_FORCE_RELOAD: "0"
    volumes:
      - ${UPLOAD_LOCATION}:/usr/src/app/upload
      - /etc/localtime:/etc/localtime:ro
    ports:
      - 2283:2283
    depends_on:
      - redis
      - database
    restart: always
    healthcheck:
      disable: false

  redis:
    image: docker.io/valkey/valkey:8-bookworm
    container_name: immich_redis
    healthcheck:
      test: redis-cli ping || exit 1
    restart: always

  database:
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0
    container_name: immich_postgres
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_DB: ${DB_DATABASE_NAME}
      POSTGRES_INITDB_ARGS: "--data-checksums"
    volumes:
      - ${DB_DATA_LOCATION}:/var/lib/postgresql/data
    restart: always
