[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "immich-cn"
version = "1.0.4"
description = "面向中国用户的 Immich 本地化增强套件：中文数据、地图体验、CDN 加速与自动化发布"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "webees" }]
maintainers = [{ name = "webees" }]
keywords = [
  "immich",
  "china",
  "localization",
  "geodata",
  "geocoding",
  "geonames",
  "chinese",
  "i18n",
  "cdn",
  "jsdelivr",
  "static-assets",
  "maps",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: GIS",
  "Topic :: System :: Systems Administration",
]
dependencies = [
  "httpx>=0.27,<1",
  "zhconv>=1.4.3",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.13",
  "pytest>=8.3",
  "pytest-cov>=6.0",
  # 工作流契约检查（scripts/check_workflows.py）需要解析 YAML
  "pyyaml>=6.0",
  "ruff>=0.9",
]

[project.urls]
Homepage = "https://github.com/webees/immich-cn"
Documentation = "https://github.com/webees/immich-cn/tree/main/docs"
Changelog = "https://github.com/webees/immich-cn/releases"
"Source Code" = "https://github.com/webees/immich-cn"
"Container Image" = "https://github.com/webees/immich-cn/pkgs/container/immich-cn%2Fgeodata"

[project.scripts]
immich-cn = "immich_cn.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/immich_cn"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "docs", "config", "pyproject.toml", "README.md", "LICENSE", "NOTICE"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["work", "outputs", ".venv", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF", "PTH", "RET", "ARG", "S"]
ignore = [
  "E501",    # 由 formatter 与 line-length 共同约束
  "S311",    # 无需密码学安全随机数
  "RUF012",  # 数据类常量可变性由类型标注控制
  # 项目面向中文用户，注释与日志刻意使用中文标点
  "RUF001",
  "RUF002",
  "RUF003",
]

[tool.ruff.lint.per-file-ignores]
# 测试中会刻意使用"假密钥"来验证脱敏逻辑
"tests/**" = ["S101", "S105", "S603", "S607", "ARG001", "ARG002"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
disallow_any_generics = true
no_implicit_reexport = true
files = ["src/immich_cn"]

[[tool.mypy.overrides]]
module = ["zhconv.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"
# 依赖（zhconv）在导入时通过 pkg_resources 触发 setuptools 弃用警告，
# 与项目代码无关，这里精确放行；其余警告仍然视为错误。
filterwarnings = [
  "error",
  "ignore:pkg_resources is deprecated as an API.*:DeprecationWarning",
  "ignore::DeprecationWarning:zhconv.*",
]

[tool.coverage.run]
branch = true
source = ["immich_cn"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = ["if TYPE_CHECKING:", "raise NotImplementedError"]
