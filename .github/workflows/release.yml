name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 版本号，例如 1.1.0（会创建 v1.1.0 标签）
        type: string
        required: true
      provider:
        description: 反向地理编码 provider
        type: choice
        default: offline
        options: [offline, auto, amap, nominatim]
      immich-version:
        description: 覆盖镜像使用的 Immich 镜像标签
        type: string
        default: release
      push-images:
        description: 是否推送镜像到 GHCR；版本化发布必须保持开启
        type: boolean
        default: true

permissions:
  contents: read

env:
  TZ: Asia/Shanghai

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  validate:
    name: 检查版本可用性
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: 检查 GitHub Release 与镜像标签未被占用
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
          PUSH_IMAGES: ${{ inputs.push-images }}
        run: |
          set -euo pipefail
          if [ "$PUSH_IMAGES" != "true" ]; then
            echo "::error::版本化发布必须推送镜像；不能创建没有对应 semantic version image tag 的 Release"
            exit 1
          fi
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::版本号必须是语义化版本，例如 1.1.0"
            exit 1
          fi
          repo_version="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          if [ "$VERSION" != "$repo_version" ]; then
            echo "::error::输入版本 $VERSION 与 pyproject.toml 的 $repo_version 不一致；请先提交版本变更"
            exit 1
          fi
          if gh release view "v${VERSION}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::v${VERSION} 已存在"
            exit 1
          fi
          for image in "ghcr.io/${GITHUB_REPOSITORY}" "ghcr.io/${GITHUB_REPOSITORY}-server"; do
            if docker manifest inspect "${image}:${VERSION}" >/dev/null 2>&1; then
              echo "::error::${image}:${VERSION} 已存在"
              exit 1
            fi
          done

  build:
    needs: validate
    uses: ./.github/workflows/_build-data.yml
    secrets: inherit
    permissions:
      contents: read
      id-token: write
      packages: write
    with:
      provider: ${{ inputs.provider }}
      immich-version: ${{ inputs.immich-version }}
      image-version: ${{ inputs.version }}
      push-images: ${{ inputs.push-images }}
      # 版本化发布总是重新构建并推送，不受"数据未变化"跳过逻辑影响
      force-publish: true

  publish:
    name: 创建版本化 Release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ${{ needs.build.outputs.artifact }}
          path: dist

      - name: 创建 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          tag="v${VERSION}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::$tag 已存在"
            exit 1
          fi
          gh release create "$tag" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "代码版本 $tag" \
            --generate-notes
