name: Auto Data Update

# 每天自动检查上游地理数据（GeoNames / Natural Earth / i18n-iso-countries）：
#   1. 用 ETag/Last-Modified 条件校验上游，未变化时不传输正文；
#   2. 有变化时重新翻译、打包、校验，并推送 GHCR 镜像；
#   3. 更新滚动 Release（auto-release）与不可变 data-* 快照；
#   4. 上游、构建配置与发布器修订都没有变化时跳过发布，避免无意义的版本与重复导入。
on:
  schedule:
    # 每天北京时间 13:23（UTC 05:23）执行；GitHub 的定时任务在高负载时可能延后
    - cron: "23 5 * * *"
  workflow_dispatch:
    inputs:
      provider:
        description: 反向地理编码 provider（offline 无需任何密钥）
        type: choice
        default: offline
        options: [offline, auto, amap, nominatim]
      immich-version:
        description: 覆盖镜像使用的 Immich 镜像标签
        type: string
        default: release
      push-images:
        description: 是否推送镜像到 GHCR
        type: boolean
        default: true
      force-publish:
        description: 即使上游数据没有变化也强制发布
        type: boolean
        default: false
      snapshot-retention:
        description: 保留最近多少个 data-* 快照（其余自动清理）
        type: number
        default: 3

permissions:
  contents: read

env:
  TZ: Asia/Shanghai

concurrency:
  group: auto-update-data
  cancel-in-progress: false

jobs:
  build:
    name: Validate and Build
    uses: ./.github/workflows/_build-data.yml
    secrets: inherit
    permissions:
      contents: read
      id-token: write
      packages: write
    with:
      provider: ${{ inputs.provider || 'offline' }}
      immich-version: ${{ inputs.immich-version || 'release' }}
      push-images: ${{ github.event_name == 'schedule' || inputs.push-images }}
      force-publish: ${{ inputs.force-publish || false }}

  release:
    name: Publish Release
    needs: build
    if: needs.build.outputs.changed == 'true' || inputs.force-publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      SNAPSHOT_RETENTION: ${{ inputs.snapshot-retention || 3 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ${{ needs.build.outputs.artifact }}
          path: dist

      - name: 更新滚动 Release（auto-release）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DATE: ${{ needs.build.outputs.date }}
        run: |
          if gh release view auto-release --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload auto-release dist/* --clobber
            gh release edit auto-release \
              --repo "$GITHUB_REPOSITORY" \
              --title "滚动数据 ${DATE}" \
              --notes-file .github/auto_release_note.md
          else
            gh release create auto-release dist/* \
              --repo "$GITHUB_REPOSITORY" \
              --title "滚动数据 ${DATE}" \
              --notes-file .github/auto_release_note.md
          fi

      # 滚动 Release 用 upload --clobber 只增不删；命名规范变更后旧资产会长期残留
      # （v4 迁移后 auto-release 上留下 21 个 pre-v4 资产），这里按本次构建的 dist 清单回收。
      - name: 清理滚动 Release 中超出本次构建的资产
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/cleanup.py --prune-release-assets auto-release --dist-dir dist --apply

      - name: 验证滚动 Release 资产与本次 dist 完全一致
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/cleanup.py --verify-release-assets auto-release --dist-dir dist

      - name: 归档不可变快照
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DATE: ${{ needs.build.outputs.date }}
          SHORT_SHA: ${{ github.sha }}
        run: |
          short_sha="${SHORT_SHA::7}"
          if gh release view "data-${DATE}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            revision_tag="data-${DATE}-sha-${short_sha}"
            if gh release view "$revision_tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "$revision_tag 已存在，跳过"
              exit 0
            fi
            gh release create "$revision_tag" dist/* \
              --repo "$GITHUB_REPOSITORY" \
              --title "数据快照修订 ${DATE} ${short_sha}" \
              --notes "该 Release 为同日后续不可变修订；提交 \`${SHORT_SHA}\`，内容与本次 auto-release 一致。"
            exit 0
          fi
          gh release create "data-${DATE}" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "数据快照 ${DATE}" \
            --notes "该 Release 为当日首次成功发布的不可变数据快照；提交 \`${SHORT_SHA}\`，内容与本次 auto-release 一致。同日后续修订使用 data-${DATE}-sha-<短提交>。"

      # README 与部署文档向用户承诺了 releases/latest/download/<canonical 名> 这个固定地址；
      # 每次发布后自检它真的可用（带重试，避免刚创建 Release 时的 CDN 传播延迟）。
      - name: 验证文档中的固定下载地址
        run: |
          set -euo pipefail
          url="https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/immich-cn-geodata-admin2-default-v1.zip"
          ok=0
          for attempt in 1 2 3 4 5; do
            if code="$(curl -sS -o /dev/null -w '%{http_code}' -L "$url")" && [ "$code" = "200" ]; then
              ok=1
              break
            fi
            echo "第 ${attempt} 次尝试未返回 200，5 秒后重试"
            sleep 5
          done
          if [ "$ok" != "1" ]; then
            echo "::error::文档中的固定下载地址未返回 HTTP 200"
            exit 1
          fi
          echo "ok: 文档固定下载地址返回 200"

      - name: 清理过期 data-* 快照
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          keep="${SNAPSHOT_RETENTION:-14}"
          echo "保留最近 ${keep} 个 data-* 快照"
          mapfile -t old_tags < <(
            gh release list --repo "$GITHUB_REPOSITORY" --limit 200 \
              --json tagName,createdAt \
              --jq "[.[] | select(.tagName | startswith(\"data-\"))] | sort_by(.createdAt) | reverse | .[${keep}:] | .[].tagName"
          )
          for tag in "${old_tags[@]:-}"; do
            [ -n "$tag" ] || continue
            echo "清理过期快照 ${tag}"
            gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
          done

      - name: 写入作业摘要
        env:
          DATE: ${{ needs.build.outputs.date }}
          DIGEST: ${{ needs.build.outputs.digest }}
        run: |
          {
            echo "## Auto Data Update ${DATE}"
            echo ""
            echo "- 上游数据：**已变化**，已重新构建并发布"
            echo "- 数据镜像摘要：\`${DIGEST:-未推送}\`"
            echo "- Immich 覆盖镜像：\`ghcr.io/${GITHUB_REPOSITORY}-server:${DATE}\`"
            echo "- data-* 快照保留：${SNAPSHOT_RETENTION:-3} 个"
          } >> "$GITHUB_STEP_SUMMARY"

  no-change:
    name: No Change
    needs: build
    permissions:
      contents: read
    # 强制发布时即使数据未变化也会走 release 分支，此处必须互斥，否则摘要自相矛盾
    if: needs.build.outputs.changed != 'true' && !inputs.force-publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 写入作业摘要
        run: |
          {
            echo "## Auto Data Update Validation"
            echo ""
            echo "上游数据、构建配置与发布器修订均无变化，已跳过发布与镜像推送。"
            echo "本次仍完成了上游 ETag 条件校验与完整构建。"
          } >> "$GITHUB_STEP_SUMMARY"

  notify-failure:
    name: Notify Failure
    needs: [build, release, no-change, resolve-previous-failure]
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - name: 创建或更新自动化异常 issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EVENT_NAME: ${{ github.event_name }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          gh label create automation --repo "$GITHUB_REPOSITORY" \
            --color B60205 --description "自动化流水线通知" --force >/dev/null 2>&1 || true

          title="自动更新数据失败（$(date +%F)）"
          body="$(printf '全自动更新数据流程执行失败。\n\n- 运行记录：%s\n- 触发方式：%s\n- 提交：%s\n\n修复后可通过 workflow_dispatch 重新执行。\n' \
            "$RUN_URL" "$EVENT_NAME" "\`$COMMIT_SHA\`")"

          number="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --label automation --search '自动更新数据失败 in:title' \
            --json number --jq '.[0].number // empty')"
          if [ -n "$number" ]; then
            gh issue comment "$number" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" \
              --title "$title" --label automation --body "$body"
          fi

  resolve-previous-failure:
    name: Resolve Previous Failure
    needs: [build, release]
    # 仅当"构建成功且发布没有失败"时关闭历史告警：
    #   build 成功 + release 跳过（无变化）→ 关闭
    #   build 成功 + release 成功        → 关闭
    #   build 成功 + release 失败        → 保持打开（否则会把刚创建的告警立刻关掉）
    if: ${{ !cancelled() && needs.build.result == 'success' && (needs.release.result == 'success' || needs.release.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - name: 关闭 automation issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          number="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --label automation \
            --search '自动更新数据失败 in:title' \
            --json number --jq '.[0].number // empty')"
          if [ -z "$number" ]; then
            echo "没有未关闭的自动化告警"
            exit 0
          fi
          gh issue comment "$number" --repo "$GITHUB_REPOSITORY" \
            --body "本次自动更新已成功：${RUN_URL}，自动关闭该告警。"
          gh issue close "$number" --repo "$GITHUB_REPOSITORY"
