name: 自动清理

# 每周清理一次历史；定时任务自动执行，手动触发默认只做 dry-run。
on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
    inputs:
      apply:
        description: 执行删除；关闭时只列出计划
        type: boolean
        default: false
      prune-all:
        description: 稳定前激进清理，只保留最新数据快照与受保护镜像
        type: boolean
        default: false
      release-retention:
        description: 保留最近多少个 data-* Release 快照
        type: number
        default: 3
      run-retention-days:
        description: Actions 运行记录至少保留多少天
        type: number
        default: 30
      run-keep-per-workflow:
        description: 每个工作流至少保留最近多少次运行
        type: number
        default: 20
      package-retention:
        description: 每个 GHCR 包至少保留最近多少个版本
        type: number
        default: 20

permissions:
  contents: read

env:
  TZ: Asia/Shanghai

concurrency:
  group: cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    name: 清理 Release / Actions / GHCR
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      actions: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: 执行清理计划
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PACKAGE_ADMIN_TOKEN: ${{ secrets.PACKAGE_ADMIN_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          APPLY: ${{ github.event_name == 'schedule' || inputs.apply }}
          PRUNE_ALL: ${{ inputs.prune-all || false }}
          RELEASE_RETENTION: ${{ inputs.release-retention || 3 }}
          RUN_RETENTION_DAYS: ${{ inputs.run-retention-days || 30 }}
          RUN_KEEP_PER_WORKFLOW: ${{ inputs.run-keep-per-workflow || 20 }}
          PACKAGE_RETENTION: ${{ inputs.package-retention || 20 }}
        run: |
          set -euo pipefail
          args=(
            --release-retention "$RELEASE_RETENTION"
            --run-retention-days "$RUN_RETENTION_DAYS"
            --run-keep-per-workflow "$RUN_KEEP_PER_WORKFLOW"
            --package-retention "$PACKAGE_RETENTION"
          )
          if [ "$APPLY" = "true" ]; then
            args+=(--apply)
          fi
          if [ "$PRUNE_ALL" = "true" ]; then
            args+=(--prune-all)
          fi
          python scripts/cleanup.py "${args[@]}"

  notify-failure:
    name: Notify Failure
    needs: [cleanup, resolve-previous-failure]
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - name: 创建或更新自动化异常 issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          gh label create automation --repo "$GITHUB_REPOSITORY" \
            --color B60205 --description "自动化流水线通知" --force >/dev/null 2>&1 || true

          title="自动清理失败（$(date +%F)）"
          body="$(printf '自动清理流程执行失败。\n\n- 运行记录：%s\n- 触发方式：%s\n\n修复后可通过 workflow_dispatch 重新执行。\n' \
            "$RUN_URL" "$EVENT_NAME")"

          number="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --label automation --search '自动清理失败 in:title' \
            --json number --jq '.[0].number // empty')"
          if [ -n "$number" ]; then
            gh issue comment "$number" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" \
              --title "$title" --label automation --body "$body"
          fi

  resolve-previous-failure:
    name: Resolve Previous Failure
    needs: cleanup
    if: success()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - name: 关闭 automation issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          number="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --label automation --search '自动清理失败 in:title' \
            --json number --jq '.[0].number // empty')"
          if [ -n "$number" ]; then
            gh issue comment "$number" --repo "$GITHUB_REPOSITORY" \
              --body "自动清理已恢复。最近一次成功运行：${RUN_URL}"
            gh issue close "$number" --repo "$GITHUB_REPOSITORY" \
              --reason completed
          fi
