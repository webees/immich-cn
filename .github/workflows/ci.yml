name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: 静态检查与单元测试 (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Ruff 检查
        run: ruff check .
      - name: Ruff 格式检查
        run: ruff format --check .
      - name: mypy 类型检查
        run: mypy
      - name: 文档契约检查
        run: python scripts/check_docs.py
      - name: 工作流契约检查
        run: python scripts/check_workflows.py
      - name: pytest
        run: pytest --cov=immich_cn --cov-report=term-missing --cov-fail-under=70

  docker:
    name: Docker 冒烟构建
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: 生成合成数据（不依赖外网）
        run: python -m scripts.smoke_data --work-dir build --dist-dir dist
      - name: 校验发布制品（zip / manifest / SHA256SUMS）
        run: python scripts/check_artifacts.py dist
      - name: 校验容器入口脚本（含 IMMICH_CN_PATTERN 组合）
        run: bash scripts/check-entrypoint.sh
      - name: 构建数据镜像
        run: docker build -f docker/geodata.Dockerfile -t immich-cn-geodata:ci .
      - name: 运行数据镜像
        run: |
          mkdir -p smoke-out
          docker run --rm -v "$PWD/smoke-out:/out" immich-cn-geodata:ci \
            --target /out --pattern '{admin_2} {admin_3}'
          test -f smoke-out/geodata/cities500.txt
          grep -q "苏州市 昆山市" smoke-out/geodata/cities500.txt
      - name: 构建 Immich 覆盖镜像（占位基础镜像，仅验证构建步骤）
        run: |
          docker build -f docker/immich.Dockerfile \
            --build-arg IMMICH_BASE=alpine \
            --build-arg IMMICH_VERSION=3.21 \
            -t immich-cn-server:ci .
      - name: 上传冒烟数据
        uses: actions/upload-artifact@v7
        with:
          name: smoke-data
          path: dist/
          retention-days: 7
