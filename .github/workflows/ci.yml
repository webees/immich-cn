name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  TZ: Asia/Shanghai

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: 静态检查与单元测试 (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Ruff 检查
        run: ruff check .
      - name: Ruff 格式检查
        run: ruff format --check .
      - name: mypy 类型检查
        run: mypy
      - name: 文档契约检查
        run: python scripts/check_docs.py
      - name: 工作流契约检查
        run: python scripts/check_workflows.py
      - name: Action 固定提交校验
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: python -m scripts.check_action_pins --repository "$REPOSITORY"
      - name: 死代码检查
        run: python -m scripts.check_dead_symbols
      - name: Shell 契约检查
        run: python scripts/check_shell.py
      - name: pytest
        run: pytest --cov=immich_cn --cov-report=term-missing --cov-fail-under=70

  docker:
    name: Docker 冒烟构建
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: 校验审计账本
        run: |
          set -euo pipefail
          git fetch --depth=1 origin audit:refs/remotes/origin/audit
          state="$(mktemp)"
          git show origin/audit:audit/state.json > "$state"
          python scripts/check_audit_ledger.py --path "$state"
      - name: 校验 GitHub Actions 工作流
        run: |
          set -euo pipefail
          version="1.7.12"
          archive="actionlint_1.7.12_linux_amd64.tar.gz"
          checksum="8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
          curl -fsSL --retry 5 --retry-all-errors \
            -o "/tmp/${archive}" \
            "https://github.com/rhysd/actionlint/releases/download/v${version}/${archive}"
          echo "${checksum}  /tmp/${archive}" | sha256sum -c -
          tar -xzf "/tmp/${archive}" -C /tmp actionlint
          /tmp/actionlint -no-color
      - name: 预拉取 Docker 基础镜像
        run: |
          bash scripts/docker-pull-retry.sh \
            public.ecr.aws/docker/library/alpine:3.24@sha256:294b683cb724975bec92580e1e685676bd4b50bda910ddb8c51d4cabeaec77e6 \
            public.ecr.aws/docker/library/alpine:3.21@sha256:ce64758a109eb420d874a118f87920e625e12d3634e03b4a5573fd9f6e5d3507 \
            public.ecr.aws/docker/library/nginx:1.29-alpine@sha256:5616878291a2eed594aee8db4dade5878cf7edcb475e59193904b198d9b830de
      - name: 生成合成数据（不依赖外网）
        run: python -m scripts.smoke_data --work-dir build --dist-dir dist
      - name: 校验发布制品（zip / manifest / immich-cn-checksums-sha256-v1.txt）
        run: python scripts/check_artifacts.py dist
      - name: 校验容器入口脚本（含 IMMICH_CN_PATTERN 组合）
        run: bash scripts/check-entrypoint.sh
      # examples/ 是文档里让用户直接复制执行的 compose 文件；官方 compose 规范要求
      # 这里真的能解析（挂载路径、镜像名、env_file 都参与校验），不能只做 YAML 语法检查。
      - name: 校验 examples 的 compose 文件可解析
        run: |
          set -euo pipefail
          workdir="$(mktemp -d)"
          cp examples/compose.*.yml "$workdir/"
          printf '%s\n' \
            'UPLOAD_LOCATION=/tmp/upload' \
            'DB_PASSWORD=example' \
            'DB_USERNAME=immich' \
            'DB_DATABASE_NAME=immich' \
            'DB_DATA_LOCATION=/tmp/db' > "$workdir/.env"
          for path in "$workdir"/compose.*.yml; do
            file="${path##*/}"
            (cd "$workdir" && docker compose -f "$file" config >/dev/null)
            echo "ok: $file"
          done
      - name: 校验 Nginx 加速源站配置
        run: |
          docker run --rm \
            -v "$PWD/examples/nginx/immich-cn.conf:/etc/nginx/conf.d/default.conf:ro" \
            --pull=never \
            public.ecr.aws/docker/library/nginx:1.29-alpine@sha256:5616878291a2eed594aee8db4dade5878cf7edcb475e59193904b198d9b830de \
            nginx -t
      - name: 构建数据镜像
        run: docker build -f docker/geodata.Dockerfile -t immich-cn-geodata:ci .
      - name: 运行数据镜像
        run: |
          mkdir -p smoke-out
          docker run --rm -v "$PWD/smoke-out:/out" immich-cn-geodata:ci \
            --target /out --pattern '{admin_2} {admin_3}'
          test -f smoke-out/geodata/cities500.txt
          grep -q "苏州市 昆山市" smoke-out/geodata/cities500.txt
      - name: 构建 Immich 覆盖镜像（占位基础镜像，仅验证构建步骤）
        run: |
          docker build -f docker/immich.Dockerfile \
            --build-arg IMMICH_BASE=public.ecr.aws/docker/library/alpine \
            --build-arg IMMICH_VERSION=3.21 \
            -t immich-cn-server:ci .
      - name: 校验镜像尺寸预算与语言包最小化
        env:
          IMAGE_SIZE_BUDGET_BYTES: "10485760"
        run: |
          set -euo pipefail
          data_size="$(docker image inspect immich-cn-geodata:ci --format '{{.Size}}')"
          server_size="$(docker image inspect immich-cn-server:ci --format '{{.Size}}')"
          echo "数据镜像：${data_size} bytes"
          echo "覆盖镜像：${server_size} bytes"
          test "$data_size" -lt "$IMAGE_SIZE_BUDGET_BYTES"
          test "$server_size" -lt "$IMAGE_SIZE_BUDGET_BYTES"
          for image in immich-cn-geodata:ci immich-cn-server:ci; do
            docker run --rm --entrypoint sh "$image" -c '
              set -eu
              test "$(find /opt/immich-cn/i18n-iso-countries/langs -maxdepth 1 -type f | wc -l)" -eq 2
              test -f /opt/immich-cn/i18n-iso-countries/langs/en.json
              test ! -e /opt/immich-cn/i18n-iso-countries/langs/zh.json
            '
          done
      - name: 上传冒烟数据
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: smoke-data
          path: dist/
          retention-days: 7
