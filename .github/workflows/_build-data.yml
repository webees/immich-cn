name: Build Data (reusable)

on:
  workflow_call:
    inputs:
      provider:
        description: 反向地理编码 provider
        type: string
        default: offline
      patterns:
        description: 需要打包的展示粒度，逗号分隔
        type: string
        default: "{admin_2},{admin_3},{admin_4},{admin_2} {admin_3},{admin_2} {admin_4},{admin_3} {admin_4},{admin_2} {admin_3} {admin_4}"
      extra-countries:
        description: 需要附带国家全量 dump 的地区
        type: string
        default: CN,HK,TW,MO,JP
      immich-version:
        description: 覆盖镜像使用的 Immich 镜像标签
        type: string
        default: release
      image-version:
        description: 额外的项目语义化版本标签；为空则不追加
        type: string
        default: ""
      server-platforms:
        description: Immich 覆盖镜像的目标平台
        type: string
        default: linux/amd64,linux/arm64
      data-platforms:
        description: 数据镜像的目标平台
        type: string
        default: linux/amd64,linux/arm64
      push-images:
        description: 是否推送镜像到 GHCR
        type: boolean
        default: false
      force-publish:
        description: 即使上游数据、构建配置与发布器修订均未变化也强制发布
        type: boolean
        default: false
    outputs:
      date:
        description: 构建日期（北京时间）
        value: ${{ jobs.build.outputs.date }}
      digest:
        description: 数据镜像摘要
        value: ${{ jobs.build.outputs.digest }}
      server-digest:
        description: Immich 覆盖镜像摘要
        value: ${{ jobs.build.outputs.server-digest }}
      artifact:
        description: 制品名称
        value: ${{ jobs.build.outputs.artifact }}
      changed:
        description: 上游数据、构建配置或发布器修订是否发生变化（true/false）
        value: ${{ jobs.build.outputs.changed }}

permissions:
  contents: read

env:
  TZ: Asia/Shanghai

jobs:
  build:
    name: 构建数据集与镜像
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write
      packages: write
    outputs:
      date: ${{ steps.meta.outputs.date }}
      digest: ${{ steps.data-image.outputs.digest }}
      server-digest: ${{ steps.server-image.outputs.digest }}
      artifact: ${{ steps.meta.outputs.artifact }}
      changed: ${{ steps.change.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # 数据构建 + 双镜像推送对磁盘压力较大，先释放 runner 上用不到的工具链
      - name: 释放磁盘空间
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af || true
          df -h /

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: 读取工具版本
        id: tool
        run: echo "version=$(python -c 'from immich_cn import __version__; print(__version__)')" >> "$GITHUB_OUTPUT"

      # 上游 zip（约 300 MiB）缓存一周；Fetcher 仍会按 ETag/Last-Modified 校验内容，
      # 缓存命中只节省传输，不能替代新鲜度检查。
      - name: 缓存最近一次下载的上游数据
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .cache/immich-cn
          key: immich-cn-sources-${{ runner.os }}-${{ steps.tool.outputs.version }}-${{ hashFiles('src/immich_cn/settings.py') }}-${{ github.run_id }}
          restore-keys: |
            immich-cn-sources-${{ runner.os }}-${{ steps.tool.outputs.version }}-${{ hashFiles('src/immich_cn/settings.py') }}-
            immich-cn-sources-${{ runner.os }}-

      - name: 构建、打包与校验
        env:
          AMAP_API_KEY: ${{ secrets.AMAP_API_KEY }}
          # 输入一律通过环境变量传递，避免 ${{ }} 直接插值进 shell 造成命令注入
          INPUT_PROVIDER: ${{ inputs.provider }}
          INPUT_PATTERNS: ${{ inputs.patterns }}
          INPUT_EXTRA_COUNTRIES: ${{ inputs.extra-countries }}
        run: |
          immich-cn all \
            --provider "$INPUT_PROVIDER" \
            --patterns "$INPUT_PATTERNS" \
            --extra-countries "$INPUT_EXTRA_COUNTRIES" \
            --revalidate

      - name: 判断发布内容是否有变化
        id: change
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMMICH_VERSION: ${{ inputs.immich-version }}
        run: |
          set -euo pipefail
          digest="$(immich-cn fingerprint dist/immich-cn-manifest-json-v1.json)"
          echo "本次发布指纹：${digest}"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

          base_image="ghcr.io/immich-app/immich-server:${IMMICH_VERSION}"
          base_digest="$(
            docker buildx imagetools inspect "$base_image" --format '{{json .Manifest}}' \
              | jq -r '.digest'
          )"
          if [ -z "$base_digest" ] || [ "$base_digest" = "null" ]; then
            echo "::error::无法解析 Immich base image digest"
            exit 1
          fi
          echo "base_digest=${base_digest}" >> "$GITHUB_OUTPUT"

          previous_base_digest=""
          if previous_image="$(
            docker buildx imagetools inspect "ghcr.io/${GITHUB_REPOSITORY}-server:latest" \
              --format '{{json .Image}}' 2>/dev/null
          )"; then
            previous_base_digest="$(
              printf '%s' "$previous_image" \
                | jq -r 'to_entries[0].value.config.Labels["org.opencontainers.image.base.digest"] // empty'
            )"
          fi
          echo "上次 Immich base digest：${previous_base_digest:-未知}"

          previous_data_digest=""
          if previous_data="$(
            docker buildx imagetools inspect "ghcr.io/${GITHUB_REPOSITORY}:latest" \
              --format '{{json .Manifest}}' 2>/dev/null
          )"; then
            previous_data_digest="$(printf '%s' "$previous_data" | jq -r '.digest // empty')"
          fi
          echo "上次数据镜像 digest：${previous_data_digest:-未知}"

          previous=""
          work="$(mktemp -d)"
          if gh release download auto-release --repo "$GITHUB_REPOSITORY" \
               --pattern immich-cn-manifest-json-v1.json --dir "$work" >/dev/null 2>&1; then
            previous="$(immich-cn fingerprint "${work}/immich-cn-manifest-json-v1.json" 2>/dev/null || true)"
            echo "上次发布指纹：${previous:-未知}"
          else
            echo "未找到历史 manifest，视为首次构建"
          fi

          release_assets_ok=false
          if [ -n "$previous" ]; then
            remote_assets="$(gh release view auto-release --repo "$GITHUB_REPOSITORY" \
              --json assets --jq '.assets[].name' 2>/dev/null | sort)"
            local_assets="$(find dist -maxdepth 1 -type f -printf '%f\n' | sort)"
            if [ "$remote_assets" = "$local_assets" ]; then
              release_assets_ok=true
            else
              echo "auto-release 资产与本次 dist 不一致，强制发布并回收多余/缺失资产"
            fi
          fi

          snapshot_ok=false
          snapshot_tag=""
          if snapshot_json="$(gh release list --repo "$GITHUB_REPOSITORY" --limit 200 \
              --json tagName,createdAt 2>/dev/null)"; then
            snapshot_tag="$(printf '%s' "$snapshot_json" \
              | jq -r '[.[] | select(.tagName | startswith("data-"))] | sort_by(.createdAt) | reverse | .[0].tagName // empty')"
          fi
          if [ -n "$snapshot_tag" ]; then
            snapshot_work="$(mktemp -d)"
            if gh release download "$snapshot_tag" --repo "$GITHUB_REPOSITORY" \
                 --pattern immich-cn-manifest-json-v1.json --dir "$snapshot_work" >/dev/null 2>&1; then
              snapshot_digest="$(immich-cn fingerprint "${snapshot_work}/immich-cn-manifest-json-v1.json" 2>/dev/null || true)"
              if [ "$snapshot_digest" = "$digest" ]; then
                snapshot_ok=true
              fi
            fi
          fi
          if [ "$snapshot_ok" != true ]; then
            echo "最新 data-* 快照缺失或与本次 fingerprint 不一致，强制修复不可变快照"
          fi

          if [ -n "$previous" ] \
            && [ "$previous" = "$digest" ] \
            && [ "$previous_base_digest" = "$base_digest" ] \
            && [ -n "$previous_data_digest" ] \
            && [ "$release_assets_ok" = true ] \
            && [ "$snapshot_ok" = true ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "上游数据、构建配置、发布器修订、Immich base digest、data image、Release 资产与不可变快照均无变化，跳过镜像推送"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            if [ -z "$previous_data_digest" ]; then
              echo "未找到可复用的 data image latest digest，强制重建镜像"
            fi
          fi

      - name: 汇总构建元信息
        id: meta
        env:
          INPUT_PROVIDER: ${{ inputs.provider }}
          INPUT_PATTERNS: ${{ inputs.patterns }}
        run: |
          date="$(date +%Y-%m-%d)"
          short_sha="${GITHUB_SHA::7}"
          echo "date=${date}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${short_sha}" >> "$GITHUB_OUTPUT"
          echo "artifact=immich-cn-dist" >> "$GITHUB_OUTPUT"
          {
            echo "## immich-cn 数据构建"
            echo ""
            echo "- 日期：${date}（北京时间）"
            echo "- Provider：${INPUT_PROVIDER}"
            echo "- 展示粒度：\`${INPUT_PATTERNS}\`"
            echo "- 提交：\`${GITHUB_SHA}\`"
            echo ""
            echo "### 产物"
            echo '```'
            ls -lh dist | tail -n +2
            echo '```'
            echo ""
            echo "### 构建统计"
            echo '```json'
            python -c "import json;print(json.dumps(json.load(open('dist/immich-cn-manifest-json-v1.json'))['stats'],ensure_ascii=False,indent=2))"
            echo '```'
          } > build-summary.md

      - name: 上传发布制品
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ steps.meta.outputs.artifact }}
          # 只上传 dist 内容，artifactId 的根目录就是发布文件本身，
          # 发布作业下载到 dist/ 后路径即为 dist/<file>。
          path: dist
          retention-days: 30
          compression-level: 0

      - name: 写入作业摘要
        run: cat build-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: 准备 QEMU
        if: inputs.push-images && (steps.change.outputs.changed == 'true' || inputs.force-publish)
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

      - name: 准备 Buildx
        if: inputs.push-images && (steps.change.outputs.changed == 'true' || inputs.force-publish)
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: 登录 GHCR
        if: inputs.push-images && (steps.change.outputs.changed == 'true' || inputs.force-publish)
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 推送数据镜像
        id: data-image
        if: inputs.push-images && (steps.change.outputs.changed == 'true' || inputs.force-publish)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: docker/geodata.Dockerfile
          platforms: ${{ inputs.data-platforms }}
          push: true
          provenance: true
          sbom: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ steps.meta.outputs.date }}
            ghcr.io/${{ github.repository }}:sha-${{ steps.meta.outputs.short_sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.tool.outputs.version }}
            org.immich-cn.data-date=${{ steps.meta.outputs.date }}

      - name: 推送 Immich 覆盖镜像
        id: server-image
        if: inputs.push-images && (steps.change.outputs.changed == 'true' || inputs.force-publish)
        # 基础镜像来自 GHCR 的另一个命名空间，偶发 429 限流，
        # 因此这里用 buildx 直接构建并做 3 次退避重试。
        env:
          IMMICH_VERSION: ${{ inputs.immich-version }}
          BASE_DIGEST: ${{ steps.change.outputs.base_digest }}
          SERVER_PLATFORMS: ${{ inputs.server-platforms }}
          DATA_DATE: ${{ steps.meta.outputs.date }}
          TOOL_VERSION: ${{ steps.tool.outputs.version }}
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY}-server"
          metadata="$(mktemp)"
          test -n "$BASE_DIGEST"
          echo "base_digest=${BASE_DIGEST}" >> "$GITHUB_OUTPUT"
          for attempt in 1 2 3; do
            if docker buildx build \
              --file docker/immich.Dockerfile \
              --platform "$SERVER_PLATFORMS" \
              --provenance=true \
              --sbom=true \
              --metadata-file "$metadata" \
              --build-arg "IMMICH_VERSION=${IMMICH_VERSION}" \
              --build-arg "IMMICH_BASE_DIGEST=@${BASE_DIGEST}" \
              --build-arg "IMMICH_CN_DATA_DATE=${DATA_DATE}" \
              --label "org.opencontainers.image.base.name=ghcr.io/immich-app/immich-server" \
              --label "org.opencontainers.image.base.digest=${BASE_DIGEST}" \
              --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
              --label "org.opencontainers.image.version=${TOOL_VERSION}" \
              --label "org.opencontainers.image.licenses=AGPL-3.0-only AND MIT" \
              --label "org.immich-cn.data-date=${DATA_DATE}" \
              --tag "${image}:latest" \
              --tag "${image}:${IMMICH_VERSION}" \
              --tag "${image}:${IMMICH_VERSION}-${DATA_DATE}" \
              --tag "${image}:sha-${GITHUB_SHA::7}" \
              --push .; then
              digest="$(jq -r '."containerimage.digest" // empty' "$metadata")"
              if [ -z "$digest" ]; then
                echo "::error::无法从 buildx 元数据读取 Immich 覆盖镜像摘要"
                exit 1
              fi
              echo "digest=${digest}" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::Immich 覆盖镜像推送失败，已重试 3 次"
              exit 1
            fi
            echo "推送失败，60 秒后重试（第 ${attempt} 次）"
            sleep 60
          done

      - name: 按最终摘要冒烟验证数据镜像
        if: inputs.push-images && (steps.change.outputs.changed == 'true' || inputs.force-publish)
        env:
          DIGEST: ${{ steps.data-image.outputs.digest }}
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY}@${DIGEST}"
          docker pull "$image"
          rm -rf digest-smoke/data
          mkdir -p digest-smoke/data
          docker run --rm -v "$PWD/digest-smoke/data:/out" "$image" \
            --target /out --pattern '{admin_2} {admin_3}'
          test -s digest-smoke/data/geodata/cities500.txt
          test -s digest-smoke/data/geodata/geodata-date.txt
          docker inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$image"

      - name: 按最终摘要冒烟验证 Immich 覆盖镜像
        if: inputs.push-images && (steps.change.outputs.changed == 'true' || inputs.force-publish)
        env:
          DIGEST: ${{ steps.server-image.outputs.digest }}
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY}-server@${DIGEST}"
          docker pull "$image"
          docker run --rm "$image" true
          docker inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$image"

      - name: 完整 Immich 服务栈冒烟（PostgreSQL + Valkey）
        if: inputs.push-images && (steps.change.outputs.changed == 'true' || inputs.force-publish)
        env:
          SERVER_DIGEST: ${{ steps.server-image.outputs.digest }}
          POSTGRES_IMAGE: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0
          REDIS_IMAGE: docker.io/valkey/valkey:9@sha256:70739f85ad2ee01a726a965584a0f94895f01b0c60b3cc8b0aeef11eaa6888cf
        run: |
          set -euo pipefail
          server_image="ghcr.io/${GITHUB_REPOSITORY}-server@${SERVER_DIGEST}"
          suffix="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${RANDOM}"
          network="immich-cn-smoke-${suffix}"
          postgres="immich-cn-postgres-${suffix}"
          redis="immich-cn-redis-${suffix}"
          server="immich-cn-server-${suffix}"
          cleanup() {
            docker rm -f "$server" "$postgres" "$redis" >/dev/null 2>&1 || true
            docker network rm "$network" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker network create "$network" >/dev/null
          docker run -d --name "$redis" --network "$network" "$REDIS_IMAGE" >/dev/null
          docker run -d --name "$postgres" --network "$network" \
            -e POSTGRES_PASSWORD=immich-smoke-password \
            -e POSTGRES_USER=immich \
            -e POSTGRES_DB=immich \
            "$POSTGRES_IMAGE" >/dev/null

          dependencies_ready=0
          for attempt in $(seq 1 90); do
            if docker exec "$redis" redis-cli ping >/dev/null 2>&1 \
              && docker exec "$postgres" pg_isready -U immich -d immich >/dev/null 2>&1; then
              dependencies_ready=1
              break
            fi
            if [ "$attempt" -eq 90 ]; then
              echo "::error::PostgreSQL 或 Valkey 未在 180 秒内就绪"
              docker logs "$postgres" || true
              docker logs "$redis" || true
              exit 1
            fi
            sleep 2
          done
          test "$dependencies_ready" = 1

          docker run -d --name "$server" --network "$network" \
            -e DB_HOSTNAME="$postgres" \
            -e DB_USERNAME=immich \
            -e DB_PASSWORD=immich-smoke-password \
            -e DB_DATABASE_NAME=immich \
            -e REDIS_HOSTNAME="$redis" \
            -e IMMICH_MACHINE_LEARNING_ENABLED=false \
            -e IMMICH_CN_PATTERN='{admin_2} {admin_3}' \
            -e IMMICH_CN_FORCE_RELOAD=1 \
            "$server_image" >/dev/null

          server_ready=0
          for attempt in $(seq 1 120); do
            if docker exec "$server" immich-healthcheck >/dev/null 2>&1; then
              server_ready=1
              break
            fi
            if [ "$attempt" -eq 120 ]; then
              echo "::error::Immich server 未在 240 秒内通过健康检查"
              docker logs "$server" || true
              exit 1
            fi
            sleep 2
          done
          test "$server_ready" = 1

          import_ready=0
          for attempt in $(seq 1 120); do
            docker logs "$server" > server-smoke.log 2>&1
            if grep -q "Geodata import completed" server-smoke.log; then
              import_ready=1
              break
            fi
            if [ "$attempt" -eq 120 ]; then
              echo "::error::Immich geodata 未在 240 秒内完成导入"
              cat server-smoke.log
              exit 1
            fi
            sleep 2
          done
          test "$import_ready" = 1
          grep -q "Successfully imported .* geodata records" server-smoke.log
          docker exec "$server" grep -q "苏州市 昆山市" /build/geodata/cities500.txt

          geodata_count="$(docker exec "$postgres" \
            psql -U immich -d immich -tAc 'SELECT count(*) FROM geodata_places;')"
          test "$geodata_count" -gt 0
          country_count="$(docker exec "$postgres" \
            psql -U immich -d immich -tAc 'SELECT count(*) FROM naturalearth_countries;')"
          test "$country_count" -gt 0
          suzhou_count="$(docker exec "$postgres" \
            psql -U immich -d immich -tAc "SELECT count(*) FROM geodata_places WHERE name LIKE '苏州市%';")"
          test "$suzhou_count" -gt 0

          docker exec "$server" node -e '
            fetch("http://127.0.0.1:2283/api/server/config")
              .then((response) => {
                if (!response.ok) process.exit(1);
                return response.json();
              })
              .then((config) => {
                if (!config.map?.lightStyle || !config.map?.darkStyle) process.exit(2);
                console.log("api-server-config-ok");
              })
              .catch(() => process.exit(3));
          '
          echo "完整 Immich 服务栈 smoke 通过"

      - name: 安装 Trivy
        if: inputs.push-images && (steps.change.outputs.changed == 'true' || inputs.force-publish)
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.75.0

      - name: 扫描镜像漏洞与许可证
        if: inputs.push-images && (steps.change.outputs.changed == 'true' || inputs.force-publish)
        env:
          DATA_DIGEST: ${{ steps.data-image.outputs.digest }}
          SERVER_DIGEST: ${{ steps.server-image.outputs.digest }}
          BASE_DIGEST: ${{ steps.server-image.outputs.base_digest }}
          IMMICH_VERSION: ${{ inputs.immich-version }}
        run: |
          set -uo pipefail
          status=0
          data_image="ghcr.io/${GITHUB_REPOSITORY}@${DATA_DIGEST}"
          server_image="ghcr.io/${GITHUB_REPOSITORY}-server@${SERVER_DIGEST}"
          base_image="ghcr.io/immich-app/immich-server:${IMMICH_VERSION}"
          test -n "$BASE_DIGEST"
          echo "$BASE_DIGEST" > trivy-server-base-digest.txt

          # 数据镜像由本项目构建，任何 HIGH/CRITICAL 都阻断。
          if ! trivy image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed \
              --format json --output trivy-data-vuln.json "$data_image"; then
            status=1
          fi
          if ! jq -r '.Results[]?.Vulnerabilities[]? | [.VulnerabilityID, .PkgName, .InstalledVersion, (.FixedVersion // "")] | @tsv' \
              trivy-data-vuln.json | sort -u > trivy-data-vuln.tsv; then
            status=1
          fi
          test ! -s trivy-data-vuln.tsv || status=1

          # server 覆盖镜像继承官方 Immich 基础镜像的漏洞。只有“新增”的 HIGH/CRITICAL 才阻断；
          # 继承项保留为显式例外报告，避免上游未修复时永久卡死全自动发布。
          if ! trivy image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed \
              --format json --output trivy-server-base-vuln.json "${base_image}@${BASE_DIGEST}"; then
            status=1
          fi
          if ! trivy image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed \
              --format json --output trivy-server-vuln.json "$server_image"; then
            status=1
          fi
          if ! jq -r '.Results[]?.Vulnerabilities[]? | [.VulnerabilityID, .PkgName, .InstalledVersion, (.FixedVersion // "")] | @tsv' \
              trivy-server-base-vuln.json | sort -u > trivy-server-base-vuln.tsv; then
            status=1
          fi
          if ! jq -r '.Results[]?.Vulnerabilities[]? | [.VulnerabilityID, .PkgName, .InstalledVersion, (.FixedVersion // "")] | @tsv' \
              trivy-server-vuln.json | sort -u > trivy-server-vuln.tsv; then
            status=1
          fi
          comm -13 trivy-server-base-vuln.tsv trivy-server-vuln.tsv > trivy-server-new-vuln.tsv
          comm -12 trivy-server-base-vuln.tsv trivy-server-vuln.tsv > trivy-server-inherited-vuln.tsv
          test ! -s trivy-server-new-vuln.tsv || status=1
          {
            echo "Immich 基础镜像：${base_image}@${BASE_DIGEST}"
            echo "继承的 HIGH/CRITICAL 例外：$(wc -l < trivy-server-inherited-vuln.tsv)"
            echo ""
            cat trivy-server-inherited-vuln.tsv
          } > trivy-server-inherited-vuln.txt

          # 许可证报告仅留证，避免把基础镜像正常的 GPL/AGPL 依赖误判成漏洞。
          trivy image --scanners license --severity HIGH,CRITICAL \
            --format table --output trivy-data-license.txt "$data_image"
          trivy image --scanners license --severity HIGH,CRITICAL \
            --format table --output trivy-server-license.txt "$server_image"

          exit "$status"

      - name: 上传 Trivy 报告
        if: always() && inputs.push-images && (steps.change.outputs.changed == 'true' || inputs.force-publish)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: trivy-reports
          path: trivy-*
          if-no-files-found: warn
          retention-days: 30

      - name: 安装 cosign
        if: inputs.push-images && (steps.change.outputs.changed == 'true' || inputs.force-publish)
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: 使用 GitHub OIDC 签名镜像摘要
        if: inputs.push-images && (steps.change.outputs.changed == 'true' || inputs.force-publish)
        env:
          DATA_DIGEST: ${{ steps.data-image.outputs.digest }}
          SERVER_DIGEST: ${{ steps.server-image.outputs.digest }}
        run: |
          set -euo pipefail
          cosign sign --yes "ghcr.io/${GITHUB_REPOSITORY}@${DATA_DIGEST}"
          cosign sign --yes "ghcr.io/${GITHUB_REPOSITORY}-server@${SERVER_DIGEST}"

      - name: 验证 Cosign keyless 签名
        if: inputs.push-images && (steps.change.outputs.changed == 'true' || inputs.force-publish)
        env:
          DATA_DIGEST: ${{ steps.data-image.outputs.digest }}
          SERVER_DIGEST: ${{ steps.server-image.outputs.digest }}
        run: |
          set -euo pipefail
          for image in \
            "ghcr.io/${GITHUB_REPOSITORY}@${DATA_DIGEST}" \
            "ghcr.io/${GITHUB_REPOSITORY}-server@${SERVER_DIGEST}"; do
            cosign verify \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              --certificate-identity-regexp "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/.*" \
              "$image" >/dev/null
          done

      - name: 追加版本标签
        if: inputs.image-version != '' && inputs.push-images && (steps.change.outputs.changed == 'true' || inputs.force-publish)
        env:
          IMAGE_VERSION: ${{ inputs.image-version }}
          DATA_DIGEST: ${{ steps.data-image.outputs.digest }}
          SERVER_DIGEST: ${{ steps.server-image.outputs.digest }}
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            --tag "ghcr.io/${GITHUB_REPOSITORY}:${IMAGE_VERSION}" \
            "ghcr.io/${GITHUB_REPOSITORY}@${DATA_DIGEST}"
          docker buildx imagetools create \
            --tag "ghcr.io/${GITHUB_REPOSITORY}-server:${IMAGE_VERSION}" \
            "ghcr.io/${GITHUB_REPOSITORY}-server@${SERVER_DIGEST}"

      - name: 写入镜像摘要到作业摘要
        if: inputs.push-images && (steps.change.outputs.changed == 'true' || inputs.force-publish)
        env:
          DATA_DIGEST: ${{ steps.data-image.outputs.digest }}
          SERVER_DIGEST: ${{ steps.server-image.outputs.digest }}
        run: |
          {
            echo ""
            echo "### 发布摘要"
            echo ""
            echo "- 数据镜像：\`ghcr.io/${GITHUB_REPOSITORY}@${DATA_DIGEST}\`"
            echo "- Immich 覆盖镜像：\`ghcr.io/${GITHUB_REPOSITORY}-server@${SERVER_DIGEST}\`"
            echo "- SBOM / provenance：已生成"
            echo "- 漏洞与许可证扫描：Trivy 已执行；数据镜像遇 HIGH/CRITICAL 阻断，server 只阻断新增项"
            echo "- 签名：Cosign keyless"
          } >> "$GITHUB_STEP_SUMMARY"
