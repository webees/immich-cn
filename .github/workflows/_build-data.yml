name: Build Data (reusable)

on:
  workflow_call:
    inputs:
      provider:
        description: 反向地理编码 provider
        type: string
        default: offline
      patterns:
        description: 需要打包的展示粒度，逗号分隔
        type: string
        default: "{admin_2},{admin_3},{admin_4},{admin_2} {admin_3},{admin_2} {admin_4},{admin_3} {admin_4},{admin_2} {admin_3} {admin_4}"
      extra-countries:
        description: 需要附带国家全量 dump 的地区
        type: string
        default: CN,HK,TW,MO,JP
      immich-version:
        description: 覆盖镜像使用的 Immich 镜像标签
        type: string
        default: release
      server-platforms:
        description: Immich 覆盖镜像的目标平台
        type: string
        default: linux/amd64,linux/arm64
      data-platforms:
        description: 数据镜像的目标平台
        type: string
        default: linux/amd64,linux/arm64
      push-images:
        description: 是否推送镜像到 GHCR
        type: boolean
        default: false
      force-publish:
        description: 即使上游数据与构建配置均未变化也强制发布
        type: boolean
        default: false
    outputs:
      date:
        description: 构建日期（UTC）
        value: ${{ jobs.build.outputs.date }}
      digest:
        description: 数据镜像摘要
        value: ${{ jobs.build.outputs.digest }}
      artifact:
        description: 制品名称
        value: ${{ jobs.build.outputs.artifact }}
      changed:
        description: 上游数据或构建配置是否发生变化（true/false）
        value: ${{ jobs.build.outputs.changed }}

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: 构建数据集与镜像
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      date: ${{ steps.meta.outputs.date }}
      digest: ${{ steps.data-image.outputs.digest }}
      artifact: ${{ steps.meta.outputs.artifact }}
      changed: ${{ steps.change.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # 数据构建 + 双镜像推送对磁盘压力较大，先释放 runner 上用不到的工具链
      - name: 释放磁盘空间
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af || true
          df -h /

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      # 上游 zip（约 300 MiB）缓存一周，命中后可跳过重复下载
      - name: 缓存最近一次下载的上游数据
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .cache/immich-cn
          key: immich-cn-sources-${{ github.run_id }}
          restore-keys: |
            immich-cn-sources-

      - name: 构建、打包与校验
        env:
          AMAP_API_KEY: ${{ secrets.AMAP_API_KEY }}
          # 输入一律通过环境变量传递，避免 ${{ }} 直接插值进 shell 造成命令注入
          INPUT_PROVIDER: ${{ inputs.provider }}
          INPUT_PATTERNS: ${{ inputs.patterns }}
          INPUT_EXTRA_COUNTRIES: ${{ inputs.extra-countries }}
        run: |
          immich-cn all \
            --provider "$INPUT_PROVIDER" \
            --patterns "$INPUT_PATTERNS" \
            --extra-countries "$INPUT_EXTRA_COUNTRIES" \
            --revalidate

      - name: 判断上游数据是否有变化
        id: change
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          digest="$(immich-cn fingerprint dist/manifest.json)"
          echo "本次数据指纹：${digest}"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

          previous=""
          work="$(mktemp -d)"
          if gh release download auto-release --repo "$GITHUB_REPOSITORY" \
               --pattern manifest.json --dir "$work" >/dev/null 2>&1; then
            previous="$(immich-cn fingerprint "${work}/manifest.json" 2>/dev/null || true)"
            echo "上次数据指纹：${previous:-未知}"
          else
            echo "未找到历史 manifest，视为首次构建"
          fi

          if [ -n "$previous" ] && [ "$previous" = "$digest" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "上游数据与构建配置均无变化，跳过镜像推送"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 汇总构建元信息
        id: meta
        env:
          INPUT_PROVIDER: ${{ inputs.provider }}
          INPUT_PATTERNS: ${{ inputs.patterns }}
        run: |
          date="$(date -u +%Y-%m-%d)"
          short_sha="${GITHUB_SHA::7}"
          echo "date=${date}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${short_sha}" >> "$GITHUB_OUTPUT"
          echo "artifact=immich-cn-dist" >> "$GITHUB_OUTPUT"
          {
            echo "## immich-cn 数据构建"
            echo ""
            echo "- 日期：${date}"
            echo "- Provider：${INPUT_PROVIDER}"
            echo "- 展示粒度：\`${INPUT_PATTERNS}\`"
            echo "- 提交：\`${GITHUB_SHA}\`"
            echo ""
            echo "### 产物"
            echo '```'
            ls -lh dist | tail -n +2
            echo '```'
            echo ""
            echo "### 构建统计"
            echo '```json'
            python -c "import json;print(json.dumps(json.load(open('dist/manifest.json'))['stats'],ensure_ascii=False,indent=2))"
            echo '```'
          } > build-summary.md

      - name: 上传发布制品
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ steps.meta.outputs.artifact }}
          # 只上传 dist 内容，artifactId 的根目录就是发布文件本身，
          # 发布作业下载到 dist/ 后路径即为 dist/<file>。
          path: dist
          retention-days: 30
          compression-level: 0

      - name: 写入作业摘要
        run: cat build-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: 准备 QEMU
        if: inputs.push-images && (steps.change.outputs.changed == 'true' || inputs.force-publish)
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

      - name: 准备 Buildx
        if: inputs.push-images && (steps.change.outputs.changed == 'true' || inputs.force-publish)
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: 登录 GHCR
        if: inputs.push-images && (steps.change.outputs.changed == 'true' || inputs.force-publish)
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 推送数据镜像
        id: data-image
        if: inputs.push-images && (steps.change.outputs.changed == 'true' || inputs.force-publish)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: docker/geodata.Dockerfile
          platforms: ${{ inputs.data-platforms }}
          push: true
          provenance: true
          sbom: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ steps.meta.outputs.date }}
            ghcr.io/${{ github.repository }}:sha-${{ steps.meta.outputs.short_sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.meta.outputs.date }}

      - name: 推送 Immich 覆盖镜像
        if: inputs.push-images && (steps.change.outputs.changed == 'true' || inputs.force-publish)
        # 基础镜像来自 GHCR 的另一个命名空间，偶发 429 限流，
        # 因此这里用 buildx 直接构建并做 3 次退避重试。
        env:
          IMMICH_VERSION: ${{ inputs.immich-version }}
          SERVER_PLATFORMS: ${{ inputs.server-platforms }}
          DATA_DATE: ${{ steps.meta.outputs.date }}
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY}-server"
          for attempt in 1 2 3; do
            if docker buildx build \
              --file docker/immich.Dockerfile \
              --platform "$SERVER_PLATFORMS" \
              --provenance=true \
              --sbom=true \
              --build-arg "IMMICH_VERSION=${IMMICH_VERSION}" \
              --build-arg "IMMICH_CN_DATA_DATE=${DATA_DATE}" \
              --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
              --label "org.opencontainers.image.version=${DATA_DATE}" \
              --tag "${image}:latest" \
              --tag "${image}:${IMMICH_VERSION}" \
              --tag "${image}:${IMMICH_VERSION}-${DATA_DATE}" \
              --push .; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::Immich 覆盖镜像推送失败，已重试 3 次"
              exit 1
            fi
            echo "推送失败，60 秒后重试（第 ${attempt} 次）"
            sleep 60
          done
