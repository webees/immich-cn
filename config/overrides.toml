# immich-cn 人工覆盖表
#
# 只有在上游数据缺失或明显不符合中文习惯时才在此处补充，
# 正常情况下请优先依赖 GeoNames 的中文别名自动解析。

[places]

[admins]
# 键为 GeoNames 的行政代码（见 admin1CodesASCII.txt / admin2Codes.txt）。
# 仅在上游中文别名缺失或不符合中文习惯时补充。
#
# 省级名称：GeoNames 的中文别名多为简称（"浙江"），而 Immich 会把 admin1Name
# 作为「省/州」显示，因此统一补全为官方全称，保持与 4 个直辖市、西藏自治区一致。
